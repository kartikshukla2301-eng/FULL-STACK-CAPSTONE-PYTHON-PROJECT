
name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'

  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm run test

      - name: Build Production Distribution
        working-directory: frontend
        run: npm run build
