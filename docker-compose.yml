version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: taskflow_postgres
    environment:
      POSTGRES_DB: taskflow_db
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: taskflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow_user -d taskflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskflow_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://taskflow_user:taskflow_password@postgres:5432/taskflow_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: taskflow_super_secret_jwt_key_change_in_production
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow_celery
    command: celery -A src.core.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://taskflow_user:taskflow_password@postgres:5432/taskflow_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: taskflow_super_secret_jwt_key_change_in_production
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
