version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tf_infra_postgres
    environment:
      POSTGRES_DB: taskflow_db
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: taskflow_password
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: tf_infra_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
    container_name: tf_infra_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://taskflow_user:taskflow_password@postgres:5432/taskflow_db
      REDIS_URL: redis://redis:6379/0

  frontend:
    build:
      context: ../frontend
    container_name: tf_infra_frontend
    ports:
      - "3000:80"
