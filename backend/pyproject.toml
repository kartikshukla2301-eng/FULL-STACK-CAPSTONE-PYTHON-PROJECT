[tool.poetry]
name = "taskflow-backend"
version = "1.0.0"
description = "Production-ready FastAPI backend for TaskFlow Pro"
authors = ["Kartik Shukla <kartik@example.com>"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
select = ["E", "F", "B", "I"]
ignore = []
line-length = 88
target-version = "py311"
